name: CD # Continuous Deployment

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Package for ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os-name: macos
            target: x86_64-apple-darwin
            architecture: x86_64
            binary-postfix: ""
            binary-name: nostui
            use-cross: false
          - os: macos-latest
            os-name: macos
            target: aarch64-apple-darwin
            architecture: arm64
            binary-postfix: ""
            use-cross: false
            binary-name: nostui
          - os: ubuntu-latest
            os-name: linux
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
            binary-postfix: ""
            use-cross: false
            binary-name: nostui
          - os: windows-latest
            os-name: windows
            target: x86_64-pc-windows-msvc
            architecture: x86_64
            binary-postfix: ".exe"
            use-cross: false
            binary-name: nostui
          - os: ubuntu-latest
            os-name: linux
            target: aarch64-unknown-linux-gnu
            architecture: arm64
            binary-postfix: ""
            use-cross: true
            binary-name: nostui
          - os: ubuntu-latest
            os-name: linux
            target: i686-unknown-linux-gnu
            architecture: i686
            binary-postfix: ""
            use-cross: true
            binary-name: nostui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1.0.8
        with:
          command: build
          target: ${{ matrix.target }}
          args: '--locked --release'
          force-use-cross: ${{ matrix.use-cross }}
          use-rust-cache: false
      - name: Install ARM strip tool
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get install -y binutils-aarch64-linux-gnu
      - name: Package binary and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          OS_NAME: ${{ matrix.os-name }}
          ARCH: ${{ matrix.architecture }}
          BINARY_POSTFIX: ${{ matrix.binary-postfix }}
        run: |
          set -euo pipefail
          cd "target/${TARGET}/release"
          binary="nostui${BINARY_POSTFIX}"
          if [[ "$TARGET" == aarch64-unknown-linux-gnu ]]; then
            aarch64-linux-gnu-strip "$binary"
          else
            strip "$binary"
          fi
          release_name="nostui-${GITHUB_REF_NAME##*/}-${OS_NAME}-${ARCH}"
          tar czf "${release_name}.tar.gz" "$binary"
          if [[ "$RUNNER_OS" == macOS ]]; then
            shasum -a 256 "${release_name}.tar.gz" > "${release_name}.sha256"
          else
            sha256sum "${release_name}.tar.gz" > "${release_name}.sha256"
          fi
      - name: Store release assets
        uses: actions/upload-artifact@v4
        with:
          name: nostui-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.binary-name }}-*.tar.gz
            target/${{ matrix.target }}/release/${{ matrix.binary-name }}-*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nostui-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish-cargo:
    name: Publishing to Cargo
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
