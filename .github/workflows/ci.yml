name: CI # Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Run tests
        run: cargo test --all-features --workspace
        env:
          TZ: 'Asia/Tokyo'

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-llvm-cov
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
        env:
          TZ: 'Asia/Tokyo'
      # The upload runs in its own job so that `id-token: write` reaches only
      # the actions that need it. This job runs `taiki-e/install-action` and,
      # through setup-rust-toolchain's cache, `Swatinem/rust-cache`, which are
      # maintained by individuals, and any action in a job holding that
      # permission can request an OIDC token.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 1

  coverage-upload:
    name: Upload Coverage
    runs-on: ubuntu-latest
    needs: coverage
    permissions:
      contents: read
      id-token: write
    steps:
      # Codecov maps the report's paths onto the files tracked in the checkout.
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          files: lcov.info
          fail_ci_if_error: false

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Clippy check
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --all-features --workspace --examples
